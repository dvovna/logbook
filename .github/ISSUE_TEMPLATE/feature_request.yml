name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: What you or your team are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Logbook to do?
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: Who would use it?
      multiple: true
      options:
        - Members
        - Managers
        - HR
        - Admins
        - People who self-host Logbook
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
      description: How you handle it now, or other tools that do it well.
