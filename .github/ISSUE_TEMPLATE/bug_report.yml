name: Bug report
description: Something in Logbook doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through [SECURITY.md](https://github.com/dvovna/logbook/blob/development/SECURITY.md), not a public issue.
        Remove tokens, secrets and people's personal data from anything you paste.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in Slack or on the server.
      placeholder: |
        1. Open Logbook's Home tab as a manager
        2. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Your role in Logbook
      options:
        - Admin
        - HR
        - Manager
        - Member
        - Doesn't matter
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, Docker image tag or commit you run.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The app's logs around that time, with tokens and personal data removed.
      render: text
