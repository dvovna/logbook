name: CI

on:
  pull_request:
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the code; pull requests from forks get no write access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc # same major as the Dockerfile

      # Node 26 ships without corepack, so yarn 1 is installed explicitly.
      - run: npm install -g yarn@1.22.22

      - uses: actions/cache@v6
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - run: yarn install --frozen-lockfile

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: yarn test --ci

      - name: Build
        run: yarn build

      # ESLint also reports code Prettier would format differently.
      - name: Lint
        run: npx eslint src test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm install -g yarn@1.22.22

      - uses: actions/cache@v6
        with:
          path: ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - run: yarn install --frozen-lockfile

      # A fresh local stack from supabase/config.toml, with supabase/migrations
      # applied. The tests only need Postgres and the REST API behind Kong.
      - name: Start Supabase
        run: npx --yes supabase@latest start -x studio,postgres-meta

      # The committed types must be what the migrations produce.
      - name: Database types match the migrations
        run: |
          yarn db:types
          if ! git diff --exit-code -- src/common/types/database.types.ts; then
            echo "::error file=src/common/types/database.types.ts::Differs from what supabase/migrations produce. Run yarn db:init, then yarn db:types, and commit the file."
            exit 1
          fi

      - name: Integration tests
        run: yarn test:int --ci
