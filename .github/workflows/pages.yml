name: Site

# Publishes site/ to GitHub Pages (https://dvovna.github.io/logbook/), with the
# docs built from docs-site/ at /logbook/docs/. It runs from main, so both
# describe the released version. Pages must use "GitHub Actions" as its source
# (Settings → Pages).
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs-site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # The version packageManager in package.json names.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The docs have their own lockfile, apart from the app's workspace.
      - run: pnpm install --ignore-workspace --frozen-lockfile
        working-directory: docs-site
      - run: pnpm build
        working-directory: docs-site
      - run: cp -R docs-site/dist site/docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
