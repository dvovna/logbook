# Weekly dependency updates as pull requests into development. Minor and patch
# updates come grouped, so there are a few PRs a week rather than dozens;
# majors come one by one, since they may need code changes. Security updates
# for known vulnerabilities are opened as soon as an advisory appears.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: Update

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: Update
