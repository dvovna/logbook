# Versions forced on dependencies of dependencies.
overrides:
  multer: ^2.5.0
  # The fixed versions of the Dependabot alerts of 2026-11-10, within the
  # same major where the fix exists there. Most come through
  # @sentry/node > @sentry/bundler-plugins (build-time code the app never
  # runs) or through the dev tools.
  'ajv@>=7.0.0 <8.18.0': ^8.18.0
  'brace-expansion@<1.1.21': ^1.1.21
  'diff@>=4.0.0 <4.0.4': ^4.0.4
  'browserslist@<4.28.7': ^4.28.7
  'glob@>=9.0.0 <14.0.2': ^14.0.2
  'js-yaml@<3.15.2': ^3.15.2
  'jws@<3.2.3': ^3.2.3
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  'picomatch@<2.3.2': ^2.3.2
  'picomatch@>=4.0.0 <4.0.4': ^4.0.4
  'serialize-javascript@<7.1.3': ^7.1.3
  'tmp@<0.2.6': ^0.2.6
  'webpack@<5.104.1': ^5.104.1
  # exceljs asks for uuid 8 (GHSA-w5hq-g745-h8pq) and only calls v4 through
  # require(); 11 still ships CommonJS.
  'uuid@<11.1.1': ^11.1.1
  # deepmerge (through @nestjs/cli, low) has no fixed version yet.

# Install scripts that may not run.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
