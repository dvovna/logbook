services:
  logbook:
    # The published image; `docker compose up --build` builds this checkout.
    image: ghcr.io/dvovna/logbook:${LOGBOOK_VERSION:-latest}
    build: .
    container_name: logbook
    restart: always
    # On SIGTERM the app stops taking requests, finishes the work in flight
    # (12 s at most), then closes its connections: Docker's default 10 s
    # would kill it before.
    stop_grace_period: 30s
    env_file: .env
    # The image defaults to 10000; keep the app and the published port in sync.
    environment:
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
